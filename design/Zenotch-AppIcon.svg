<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="0.6" y2="1">
    <stop offset="0" stop-color="#2b2f5e"/><stop offset="0.55" stop-color="#14172f"/><stop offset="1" stop-color="#090a16"/>
  </linearGradient>
  <linearGradient id="ring" x1="0" y1="1" x2="1" y2="0">
    <stop offset="0" stop-color="#5eead4"/><stop offset="0.55" stop-color="#8ab4ff"/><stop offset="1" stop-color="#c4a7ff"/>
  </linearGradient>
  <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
    <stop offset="0" stop-color="#7c8cff" stop-opacity="0.35"/><stop offset="1" stop-color="#7c8cff" stop-opacity="0"/>
  </radialGradient>
  <linearGradient id="gloss" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#fff" stop-opacity="0.10"/><stop offset="0.4" stop-color="#fff" stop-opacity="0"/>
  </linearGradient>
  <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
    <feDropShadow dx="0" dy="18" stdDeviation="22" flood-color="#000" flood-opacity="0.45"/>
  </filter>
  <filter id="soft"><feGaussianBlur stdDeviation="14"/></filter>
  <clipPath id="tile"><rect x="100" y="100" width="824" height="824" rx="186"/></clipPath>
</defs>
<rect x="100" y="100" width="824" height="824" rx="186" fill="url(#bg)" filter="url(#shadow)"/>
<g clip-path="url(#tile)">
  <circle cx="512" cy="598" r="330" fill="url(#glow)"/>
  <rect x="100" y="100" width="824" height="824" fill="url(#gloss)"/>
  <!-- notch -->
  <path d="M 322 100 H 702 V 196 A 74 74 0 0 1 628 270 H 396 A 74 74 0 0 1 322 196 Z" fill="#000"/>
  <path d="M 322 100 H 702 V 196 A 74 74 0 0 1 628 270 H 396 A 74 74 0 0 1 322 196 Z" fill="none" stroke="#ffffff" stroke-opacity="0.10" stroke-width="3"/>
  <!-- enso ring -->
  <path d="M 695.60 492.00 A 212 212 0 1 1 584.51 398.79" fill="none" stroke="url(#ring)" stroke-width="64" stroke-linecap="round" opacity="0.55" filter="url(#soft)"/>
  <path d="M 695.60 492.00 A 212 212 0 1 1 584.51 398.79" fill="none" stroke="url(#ring)" stroke-width="56" stroke-linecap="round"/>
</g>
<rect x="101.5" y="101.5" width="821" height="821" rx="184.5" fill="none" stroke="#fff" stroke-opacity="0.12" stroke-width="3"/>
</svg>